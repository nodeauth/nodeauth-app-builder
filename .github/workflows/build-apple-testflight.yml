name: Build Apple TestFlight (App Store)

on:
  workflow_dispatch:
    inputs:
      target_branch:
        description: 'Git branch to build'
        required: true
        default: 'main'
        type: string

jobs:
  build_and_submit:
    name: Build and Submit to App Store
    runs-on: macos-latest
    
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.MASTER_REPO_PATH }}
          token: ${{ secrets.MASTER_GITHUB_TOKEN }}
          ref: ${{ inputs.target_branch }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Expo
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          eas-version: latest
          packager: npm
          token: ${{ secrets.EXPO_ACCESS_TOKEN }}

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps

      - name: Local Build iOS IPA
        env:
          # 提供苹果认证凭据供 EAS 本地构建拉取证书与 Profile
          EXPO_APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          EXPO_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          eas build --platform ios --profile production --local --output=./build.ipa --non-interactive

      - name: Submit to TestFlight
        env:
          # 提供苹果认证凭据供 EAS 上传 ipa 至 App Store Connect / TestFlight
          EXPO_APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          EXPO_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_ASC_APP_ID: ${{ secrets.APPLE_ASC_APP_ID }}
          EXPO_APPLE_ID: ${{ secrets.APPLE_ID }}
        run: |
          # 动态将 ascAppId、appleId 与 appleTeamId 注入到 eas.json 的 submit.production.ios 配置中
          node -e '
            const fs = require("fs");
            if (!process.env.EXPO_APPLE_ID) {
              console.error("❌ 校验失败: 未检测到环境变量 EXPO_APPLE_ID！");
              console.error("   请前往 GitHub 仓库 [Settings] -> [Secrets and variables] -> [Actions]");
              console.error("   添加 Secret: [APPLE_ID]，值为您的 Apple 开发者账号登录邮箱（例如 name@example.com）。");
              process.exit(1);
            }
            const eas = JSON.parse(fs.readFileSync("eas.json", "utf8"));
            eas.submit = eas.submit || {};
            eas.submit.production = eas.submit.production || {};
            eas.submit.production.ios = {
              ...eas.submit.production.ios,
              ascAppId: process.env.APPLE_ASC_APP_ID,
              appleId: process.env.EXPO_APPLE_ID,
              appleTeamId: process.env.EXPO_APPLE_TEAM_ID
            };
            fs.writeFileSync("eas.json", JSON.stringify(eas, null, 2));
            console.log("✅ 成功注入配置至 eas.json 的 submit.production.ios:");
            console.log("   - ascAppId:", process.env.APPLE_ASC_APP_ID ? "已配置" : "❌ 缺失");
            console.log("   - appleId:", process.env.EXPO_APPLE_ID ? "已配置" : "❌ 缺失");
            console.log("   - appleTeamId:", process.env.EXPO_APPLE_TEAM_ID ? "已配置" : "❌ 缺失");
          '
          eas submit --platform ios --profile production --path=./build.ipa --non-interactive
