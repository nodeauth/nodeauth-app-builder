name: Build Android AAB (Google Play)

on:
  workflow_dispatch:
    inputs:
      target_branch:
        description: 'Git branch to build'
        required: true
        default: 'main'
        type: string

jobs:
  build:
    name: Build Android Release AAB
    runs-on: ubuntu-latest

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.MASTER_REPO_PATH }}
          token: ${{ secrets.MASTER_GITHUB_TOKEN }}
          ref: ${{ inputs.target_branch }}

      - name: 配置 Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 配置 Node.js 环境
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 安装 npm 依赖
        run: npm ci --legacy-peer-deps

      - name: 提取版本号与构建信息
        id: meta
        run: |
          VERSION=$(node -p "try { require('./package.json').version } catch(e) { 'unknown' }")
          COMMIT_HASH=$(git rev-parse --short HEAD)
          DATE=$(date +'%Y%m%d')
          AAB_NAME="NodeAuth-v${VERSION}-${COMMIT_HASH}-${DATE}-Release"
          echo "AAB_NAME=${AAB_NAME}" >> $GITHUB_ENV
          echo "AAB 产物名称将设置为: ${AAB_NAME}"

      - name: 生成原生 Android 工程 (Prebuild)
        run: npx expo prebuild --platform android --clean

      - name: 配置 Gradle 缓存与运行环境
        uses: gradle/actions/setup-gradle@v3

      - name: 配置 Android 签名证书 (Keystore)
        working-directory: android/app
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          # 1. 确保 Secret 存在以防空跑报错
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "Error: ANDROID_KEYSTORE_BASE64 secret is not set!"
            exit 1
          fi
          # 2. 将 base64 字符串解码为真正的 release.keystore 文件
          echo "$KEYSTORE_BASE64" | base64 --decode > release.keystore
          echo "Keystore 文件已成功生成在 android/app/release.keystore"

      - name: 编译并打上正式签名的 Release AAB
        working-directory: android
        # 注入 Android Gradle Plugin 的全局签名参数，强制覆盖默认的 Debug 签名
        run: |
          chmod +x gradlew
          ./gradlew bundleRelease -x lintVitalRelease --no-daemon \
            -Pandroid.injected.signing.store.file=$(pwd)/app/release.keystore \
            -Pandroid.injected.signing.store.password=${{ secrets.ANDROID_KEYSTORE_PASSWORD }} \
            -Pandroid.injected.signing.key.alias=${{ secrets.ANDROID_KEY_ALIAS }} \
            -Pandroid.injected.signing.key.password=${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: 重命名并检查 AAB 产物
        working-directory: android/app/build/outputs/bundle/release/
        run: |
          AAB_FILE=$(ls *.aab | head -n 1)
          mv "$AAB_FILE" "${{ env.AAB_NAME }}.aab"
          echo "=== 检查生成的 AAB 产物 ==="
          ls -lh "${{ env.AAB_NAME }}.aab"

      - name: 加密构建产物
        # 由于 AAB 包含未重新压缩的源代码/资源，同样建议加密保护
        run: |
          zip -q -P ${{ secrets.ARTIFACT_PASSWORD }} -j ${{ env.AAB_NAME }}-Encrypted.zip android/app/build/outputs/bundle/release/${{ env.AAB_NAME }}.aab

      - name: 上传加密 AAB 到 Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.AAB_NAME }}
          path: ${{ env.AAB_NAME }}-Encrypted.zip
          retention-days: 7

      - name: 发布至 Google Play 内部测试 (Internal Track)
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.ANDROID_GOOGLE_PLAY_CONFIG_JSON }}
          packageName: com.nextmatrix.nodeauth
          releaseFiles: android/app/build/outputs/bundle/release/${{ env.AAB_NAME }}.aab
          tracks: internal
          status: completed

      - name: 强制清理敏感凭据与临时文件
        if: always()
        run: |
          # 1. 彻底物理销毁落盘的 Keystore 签名私钥实体文件
          rm -f android/app/release.keystore
          # 2. 清理未加密的原始 AAB 产物
          rm -rf android/app/build/outputs/bundle/release/*.aab
          echo "✅ 敏感签名凭据与未加密 AAB 产物已安全销毁"
